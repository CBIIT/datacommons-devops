name: Update monitor Datadog job
run-name: Monitor Datadog Update Job 
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: 
    inputs:
      csv_file:
        description: 'CSV file to run'
        required: true
        default: https://raw.githubusercontent.com/CBIIT/datacommons-devops/main/monitoring/FNL-Monitoring-List-datadog.csv

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        id: python-setup
        uses: actions/setup-python@b64ffcaf5b410884ad320a9cfac8866006a109aa     # v4.8.0
        with:
          python-version: "3.9"

      - name: Install Dependencies
        id: install-dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r monitoring/scripts/datadog/requirements.txt

      - name: Run the monitor update script
        id: monitor-update
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_ALERT_EMAIL: ${{ secrets.EMAIL }}
          DD_PRIVATE_LOCATION_ID: aws:us-gov-west-1
          DD_SITE: "ddog-gov.com"
        run: |
          CSV_FILE="https://raw.githubusercontent.com/CBIIT/datacommons-devops/main/monitoring/FNL-Monitoring-List-datadog.csv"

          if [ -n "${{ github.event.inputs.csv_file }}" ]; then
            CSV_FILE="${{ github.event.inputs.csv_file }}"
          fi

          python3 -u monitoring/scripts/datadog/monitor_update_csv.py -f "$CSV_FILE"

      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08     # v1.6.0
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          message: "Datadog Monitors Updated"
        if: always()
