name: Update monitor Datadog job
run-name: Monitor Datadog Update Job 
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: 
    inputs:
      csv_file:
        description: 'CSV file to run'
        required: true
        default: https://raw.githubusercontent.com/CBIIT/datacommons-devops/testing/datadog-monitors/monitoring/cbioPortal-Monitoring-List.csv

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        id: python-setup
        uses: actions/setup-python@b64ffcaf5b410884ad320a9cfac8866006a109aa     # v4.8.0
        with:
          python-version: "3.9"

      - name: Install Dependencies
        id: install-dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r monitoring/scripts/datadog/requirements.txt

      - name: Run the monitor update script
        id: monitor-update
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_ALERT_EMAIL: ${{ secrets.EMAIL }}
          DD_PRIVATE_LOCATION_ID: ${{ secrets.LOCATION }}
          DD_SITE: "ddog-gov.com"
        run: |
          set -x  # Enable bash command tracing

          CSV_FILE="https://raw.githubusercontent.com/CBIIT/datacommons-devops/testing/datadog-monitors/monitoring/cbioPortal-Monitoring-List.csv"

          if [ -n "${{ github.event.inputs.csv_file }}" ]; then
            CSV_FILE="${{ github.event.inputs.csv_file }}"
          fi

          echo "Using CSV file: $CSV_FILE"
          echo "Datadog site: $DD_SITE"

          # Validate secrets exist without printing values
          if [ -z "$DD_API_KEY" ]; then
            echo "ERROR: DD_API_KEY is empty"
            exit 1
          else
            echo "DD_API_KEY is set"
          fi

          if [ -z "$DD_APP_KEY" ]; then
            echo "ERROR: DD_APP_KEY is empty"
            exit 1
          else
            echo "DD_APP_KEY is set"
          fi

          echo "Running Datadog monitor update..."

          python3 -u monitoring/scripts/datadog/monitor_update_csv.py \
            -f "$CSV_FILE" \
            2>&1 | tee monitor_update.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "Python exit code: $EXIT_CODE"

          echo "===== Last 100 log lines ====="
          tail -100 monitor_update.log

          exit $EXIT_CODE

      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08     # v1.6.0
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          message: "Datadog Monitors Updated"
        if: always()
